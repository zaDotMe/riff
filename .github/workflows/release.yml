name: Release Windows & Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.7.6)"
        required: false
        default: "v0.7.6"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run tests
        run: cargo test --release -p riff-core -p riff-slint

      - name: Build release binaries (riff-slint, riff-tauri, riff-core)
        run: cargo build --release -p riff-slint -p riff-tauri -p riff-core

      - name: Build Tauri Windows installer (.exe NSIS / .msi)
        run: npx tauri build --bundles nsis,msi
        continue-on-error: true

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item target\release\riff-slint.exe dist-release\Riff-Slint-windows-x64.exe
          Copy-Item target\release\riff-tauri.exe dist-release\Riff-Tauri-windows-x64.exe
          Compress-Archive -Path target\release\riff-slint.exe, target\release\riff-tauri.exe, target\release\riff-core.exe, src-tauri\icons\icon.ico -DestinationPath dist-release\Riff-windows-x64-portable.zip -Force
          Get-ChildItem target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist-release\Riff-Setup-windows-x64.exe"
          }
          Get-ChildItem target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName "dist-release\Riff-Setup-windows-x64.msi"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-release/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run tests
        run: cargo test --release -p riff-core -p riff-slint

      - name: Build release binaries (riff-slint, riff-tauri, riff-core)
        run: cargo build --release -p riff-slint -p riff-tauri -p riff-core

      - name: Build Tauri Linux bundles (.deb / .AppImage)
        run: npx tauri build --bundles deb,appimage
        continue-on-error: true

      - name: Package Linux artifacts
        run: |
          mkdir -p dist-release stage-linux
          cp target/release/riff-slint stage-linux/riff-slint
          cp target/release/riff-tauri stage-linux/riff-tauri
          cp target/release/riff-core stage-linux/riff-core
          cp src-tauri/icons/icon.png stage-linux/riff.png
          cp packaging/linux/riff.desktop stage-linux/riff.desktop
          cp packaging/linux/install.sh stage-linux/install.sh
          chmod +x stage-linux/riff-slint stage-linux/riff-tauri stage-linux/riff-core stage-linux/install.sh
          tar -czf dist-release/Riff-linux-x86_64.tar.gz -C stage-linux .
          cp target/release/riff-slint dist-release/riff-slint-linux-x86_64
          find target/release/bundle/deb -name "*.deb" -exec cp {} dist-release/Riff-linux-amd64.deb \; || true
          find target/release/bundle/appimage -name "*.AppImage" -exec cp {} dist-release/Riff-linux-x86_64.AppImage \; || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist-release/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets

      - name: Determine tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'v0.7.6' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Riff ${{ steps.meta.outputs.tag }} (Windows & Linux)"
          body_path: docs/RELEASE_NOTES_v0.7.6.md
          files: release-assets/*
          draft: false
          prerelease: false
