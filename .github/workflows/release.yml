name: Release Windows, Linux & Google TV

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.7.8)"
        required: false
        default: "v0.7.8"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run tests
        run: cargo test --release -p riff-core -p riff-slint

      - name: Build release binaries (riff-slint, riff-core)
        run: cargo build --release -p riff-slint -p riff-core

      - name: Build Slint Windows Setup installer (.exe NSIS)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $ver = if ($env:GITHUB_REF_NAME -and $env:GITHUB_REF_NAME.StartsWith("v")) { $env:GITHUB_REF_NAME.Substring(1) } else { "0.7.8" }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue)?.Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install nsis -y
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis "/DAPP_VERSION=$ver" "packaging\windows\riff-slint.nsi"

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item target\release\riff-slint.exe dist-release\Riff-Slint-windows-x64.exe
          Compress-Archive -Path target\release\riff-slint.exe, target\release\riff-core.exe, src-tauri\icons\icon.ico -DestinationPath dist-release\Riff-windows-x64-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-release/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Run tests
        run: cargo test --release -p riff-core -p riff-slint

      - name: Build release binaries (riff-slint, riff-core)
        run: cargo build --release -p riff-slint -p riff-core

      - name: Package Linux artifacts (tar.gz & Slint .deb)
        run: |
          mkdir -p dist-release stage-linux
          cp target/release/riff-slint stage-linux/riff-slint
          cp target/release/riff-core stage-linux/riff-core
          cp src-tauri/icons/icon.png stage-linux/riff.png
          cp packaging/linux/riff.desktop stage-linux/riff.desktop
          cp packaging/linux/install.sh stage-linux/install.sh
          chmod +x stage-linux/riff-slint stage-linux/riff-core stage-linux/install.sh
          tar -czf dist-release/Riff-linux-x86_64.tar.gz -C stage-linux .
          cp target/release/riff-slint dist-release/riff-slint-linux-x86_64

          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$VER" ] || [ "$VER" = "$GITHUB_REF_NAME" ]; then VER="0.7.8"; fi
          mkdir -p deb-pkg/DEBIAN deb-pkg/usr/bin deb-pkg/usr/share/applications deb-pkg/usr/share/icons/hicolor/512x512/apps
          cp target/release/riff-slint deb-pkg/usr/bin/riff-slint
          cp target/release/riff-core deb-pkg/usr/bin/riff-core
          chmod 755 deb-pkg/usr/bin/riff-slint deb-pkg/usr/bin/riff-core
          cp packaging/linux/riff.desktop deb-pkg/usr/share/applications/riff.desktop
          cp src-tauri/icons/icon.png deb-pkg/usr/share/icons/hicolor/512x512/apps/riff.png
          cat > deb-pkg/DEBIAN/control <<EOF
          Package: riff
          Version: ${VER}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: zaDotMe <asihmin808@gmail.com>
          Description: Riff - Native Rust + Slint desktop music player
          EOF
          dpkg-deb --build deb-pkg dist-release/Riff-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist-release/*

  build-google-tv:
    name: Build Google TV / Android TV (Slint APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android target
        run: rustup target add aarch64-linux-android

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          NDK_DIR="${ANDROID_HOME}/ndk/27.2.12479018"
          echo "ANDROID_NDK_ROOT=${NDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR}" >> "$GITHUB_ENV"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build arm64-v8a Google TV APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/riff-release.keystore"
            export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/riff-release.keystore"
            cargo apk build --release -p riff-slint --lib
          else
            echo "No release keystore secret; producing a debug-signed Android TV APK."
            cargo apk build -p riff-slint --lib
          fi

      - name: Package Google TV artifact
        run: |
          mkdir -p dist-release
          APK=$(find target/release/apk -name "*.apk" -print -quit 2>/dev/null || true)
          if [ -z "$APK" ]; then APK=$(find target -name "*.apk" -print -quit 2>/dev/null || true); fi
          if [ -z "$APK" ]; then echo "No APK produced" >&2; exit 1; fi
          cp "$APK" dist-release/Riff-google-tv-arm64-v8a.apk

      - uses: actions/upload-artifact@v4
        with:
          name: google-tv-artifacts
          path: dist-release/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-google-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release-assets

      - name: Download Google TV artifacts
        uses: actions/download-artifact@v4
        with:
          name: google-tv-artifacts
          path: release-assets

      - name: Determine tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag || 'v0.7.8' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Riff ${{ steps.meta.outputs.tag }} (Pure Slint • Windows, Linux & Google TV)"
          body_path: docs/RELEASE_NOTES_v0.7.8.md
          files: release-assets/*
          draft: false
          prerelease: false
