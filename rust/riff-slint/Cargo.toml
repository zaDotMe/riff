[package]
name = "riff-slint"
version = "0.7.6"
edition = "2021"
authors = ["rootscripts"]
license = "MIT"
description = "Riff - Native Slint Desktop UI"

[lib]
name = "riff_slint"
path = "src/lib.rs"

[[bin]]
name = "riff-slint"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
slint = "1.19"
riff-core = { path = "../riff-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tracing = "0.1"
rfd = "0.15"
