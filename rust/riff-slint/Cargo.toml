[package]
name = "riff-slint"
version = "0.7.85"
edition = "2021"
authors = ["rootscripts"]
license = "MIT"
description = "Riff - Native Slint Desktop UI"

[lib]
name = "riff_slint"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "riff-slint"
path = "src/main.rs"

[package.metadata.android]
package = "com.rootscripts.riff"
apk_name = "Riff-google-tv-arm64-v8a"
build_targets = ["aarch64-linux-android"]
label = "Riff"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
uses_cleartext_traffic = true

[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.hardware.gamepad"
required = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"

[package.metadata.android.application.activity]
orientation = "landscape"
launch_mode = "singleTask"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LEANBACK_LAUNCHER"]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
slint = { version = "1.19", features = ["backend-android-activity-06"] }
riff-core = { path = "../riff-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tracing = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
open = "5"
